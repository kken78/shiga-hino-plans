# 計画ダッシュボードの自動検査(DESIGN.md ADR-8)。
# プルリクエストと main への push のたびに、CLAUDE.md の定型フローの検証を実行する。
name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: ツールの構文確認(原典 PDF を使うツールは CI では動かさない)
        run: python3 -m py_compile tools/*.py
      - name: スキーマ検証(validate_schema.py)
        run: |
          for f in data/plans/*.json; do python3 tools/validate_schema.py "$f" || exit 1; done
          # 当初予算の附表(PLAN_SCHEMA §9)
          for f in data/fuhyo/*.json; do [ -e "$f" ] || continue; python3 tools/validate_schema.py "$f" || exit 1; done
          # 公共施設等総合管理計画の施設概要の表(PLAN_SCHEMA §12)と、その道具の検査
          for f in data/shisetsu/*.json; do [ -e "$f" ] || continue; python3 tools/validate_schema.py "$f" || exit 1; done
          python3 tools/shisetsu.py --selftest

      - name: 全計画とハブを再生成(render_plan.py・build.py・fuhyo.py・shisetsu.py)
        run: |
          for f in data/plans/*.json; do python3 tools/render_plan.py "$(basename "$f" .json)" || exit 1; done
          python3 tools/build.py
          # 附表は照合表だけを作る(PLAN_SCHEMA §9)
          for f in data/fuhyo/*.json; do [ -e "$f" ] || continue; python3 tools/fuhyo.py "$(basename "$f" .json)" || exit 1; done
          # 施設概要の表は検算(PLAN_SCHEMA §12.5)を通してから照合表だけを作る
          for f in data/shisetsu/*.json; do [ -e "$f" ] || continue; python3 tools/shisetsu.py "$(basename "$f" .json)" || exit 1; done

      - name: 生成物がコミットされたものと一致するか
        run: |
          if ! git diff --exit-code --stat -- docs build; then
            echo "::error::docs/ または build/ が JSON から再生成した結果と一致しません。全計画を再描画してコミットしてください。"
            exit 1
          fi

      - name: 検収台帳の検証(audit_worksheet.py・ADR-7)
        run: |
          for f in data/audit_log/*.tsv; do [ -e "$f" ] || continue; python3 tools/audit_worksheet.py "$(basename "$f" .tsv)" || exit 1; done
      - name: 原典との照合の表示の検査(check_audit_display.py・PLAN_SCHEMA §11・ADR-11)
        run: |
          python3 tools/check_audit_display.py --selftest
          python3 tools/check_audit_display.py
      - name: 原典の誤りの記録の検査(check_source_issues.py・ADR-7 補遺 L)
        run: python3 tools/check_source_issues.py
      - name: 原典の文字の検証(check_source_text.py・PLAN_SCHEMA §10.2・ADR-10。原典 PDF は使わない)
        run: python3 tools/check_source_text.py

      - name: 共通の部品が hino-portal の正本と同じかと、文字の大きさ(hino-portal の shared/check.py --fonts・ADR-15)
        run: |
          git clone --depth 1 https://github.com/kken78/hino-portal.git /tmp/hino-portal
          python3 /tmp/hino-portal/shared/check.py --fonts --hyoki docs/index.html docs/plans/*.html

      - name: 出力検証とデザインシステムの静的検査(validate.mjs・ゲートA)
        run: node tools/validate.mjs docs/index.html docs/plans/*.html

      - name: 実ブラウザでの表示検査(check_mobile.mjs・ゲートB)
        run: |
          npm install --no-save --no-package-lock playwright@1.49.1
          npx playwright install --with-deps chromium
          node tools/check_mobile.mjs docs/index.html docs/plans/*.html

      - name: 実ブラウザでの文字の大きさと横のはみ出し(hino-portal の shared/check_mobile.mjs・ADR-15)
        # Playwright は前の手順で作業ツリーの node_modules に入れたもの(リポジトリの package.json は増やさない)
        run: PLAYWRIGHT_MODULE="$GITHUB_WORKSPACE/node_modules/playwright/index.mjs" node /tmp/hino-portal/shared/check_mobile.mjs docs/index.html docs/plans/*.html
